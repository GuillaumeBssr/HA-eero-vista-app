server {
    listen 8099 default_server;
    server_name _;

    # Home Assistant Supervisor's Ingress gateway.
    allow 172.30.32.2;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect ~^(/.*)$ $http_x_ingress_path$1;
        proxy_cookie_path / $http_x_ingress_path/;

        # Upstream eeroVista 2.9.7 emits root-relative URLs. Rewrite them to
        # the per-session prefix supplied by Home Assistant Ingress.
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html application/javascript text/css;
        sub_filter '="/' '="$http_x_ingress_path/';
        sub_filter "='/" "='$http_x_ingress_path/";
        sub_filter 'fetch("/' 'fetch("$http_x_ingress_path/';
        sub_filter "fetch('/" "fetch('$http_x_ingress_path/";
        sub_filter 'fetch(`/' 'fetch(`$http_x_ingress_path/';
        sub_filter 'url("/' 'url("$http_x_ingress_path/';
        sub_filter "url('/" "url('$http_x_ingress_path/";
        sub_filter 'url(/' 'url($http_x_ingress_path/';
        sub_filter 'window.location.href = "/' 'window.location.href = "$http_x_ingress_path/';
        sub_filter "window.location.href = '/" "window.location.href = '$http_x_ingress_path/";
    }
}
