name: eeroVista
version: "0.3.2"
slug: eerovista
description: Read-only monitoring and topology visualization for Eero mesh networks
url: https://github.com/GuillaumeBssr/HA-eero-vista-app
startup: application
boot: auto
init: false
stage: experimental

arch:
  - aarch64

ports:
  8080/tcp: 8780

ports_description:
  8080/tcp: eeroVista web interface and API

watchdog: "http://[HOST]:[PORT:8080]/api/health"

ingress: true
ingress_port: 8099
panel_icon: mdi:wifi
panel_title: eeroVista
panel_admin: false

options:
  timezone: "Europe/Paris"
  collection_interval_devices: 30
  collection_interval_network: 60
  data_retention_raw_days: 7
  data_retention_hourly_days: 30
  data_retention_daily_days: 365
  web_concurrency: 2
  log_level: "INFO"
  mqtt_enabled: false
  mqtt_broker: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_topic_prefix: "eerovista"
  mqtt_discovery_prefix: "homeassistant"
  mqtt_publish_interval: 60

schema:
  timezone: str
  collection_interval_devices: int(10,3600)
  collection_interval_network: int(10,3600)
  data_retention_raw_days: int(1,365)
  data_retention_hourly_days: int(1,730)
  data_retention_daily_days: int(1,3650)
  web_concurrency: int(1,8)
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  mqtt_enabled: bool
  mqtt_broker: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  mqtt_topic_prefix: str
  mqtt_discovery_prefix: str
  mqtt_publish_interval: int(10,3600)
